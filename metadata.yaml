name: astrbot_plugin_auto_evolve
display_name: 自主进化 · AutoEvolve
short_desc: 让 AI 自己写补丁、自己验收 —— 提示词越用越准
desc: >-
  一套会自己改自己的提示词进化引擎。到点把最近的对话连同当前人格全文重读一遍，
  找出反复出现的模板句、写了却没生效的规矩、和真实对话脱节的表述；每条都写成
  「改哪一句 / 改成什么 / 为什么改」，落地前先自证（唯一命中、不重复、不越层、
  不删锚点），过了才动，动前备份、动完抽样复验。补丁经你点头才落库，随时可撤。
  用得越久，它越像你要的那个人。
version: "1.0.0"
author: YG
repo: "https://github.com/949829160/astrbot_plugin_auto_evolve"
license: "MIT"
astrbot_version: ">=4.11.4"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - webchat
tags:
  - 自主进化
  - 提示词优化
  - 自我反思
  - 补丁审批
  - 质量验证
keywords:
  - AutoEvolve
  - self-reflect
  - persona patch
  - prompt evolution
  - 人格维护
  - 自动复盘
  - 质量门禁
  - 回滚
  - 观察画像
features:
  - 定时复盘：按 HH:MM 自己醒，读上次之后的新对话
  - 三层门槛：少于 8 轮不动、8–20 轮只记账、信息量不足不动
  - 补丁自证：唯一命中 / 不重复 / 不越层 / 不删锚点
  - 四道关：体检、字数上限、累计漂移、抽样复验
  - 审批与回滚：/批 才落库，/撤 随时退回
  - 观察画像：反复被指出的问题下一轮自动带进提示词
  - 词表补丁：用词偏好当数据维护，不动代码
  - 代码补丁：只进队列，改前备份、改后编译校验、失败自动回滚
